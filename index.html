<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Architecture of Personality</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#203540;font:16px system-ui,Arial}header{background:#183845;color:white;padding:24px max(20px,calc((100vw - 1050px)/2))}h1{margin:0;font-size:27px}header p{margin:5px 0;color:#bdd0d6}main{max-width:1050px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:245px 1fr;gap:18px}.card{background:white;border:1px solid #dbe5e8;border-radius:13px;padding:20px;margin-bottom:16px}h2{margin:0 0 15px;font-size:21px}h3{font-size:16px;margin:0 0 12px}.muted{color:#667984;font-size:13px}button{border:0;background:#176c81;color:white;border-radius:8px;padding:10px 14px;cursor:pointer;font:inherit}button.secondary{background:#e6eff1;color:#244452}button:disabled{opacity:.4}input[type=text],select{width:100%;padding:10px;border:1px solid #cad7dc;border-radius:8px;font:inherit}.field{margin:12px 0}.field label{display:block;margin-bottom:5px;font-size:13px}.nav{display:block;width:100%;text-align:left;background:#f1f6f7;color:#244653;margin:5px 0}.nav.active{background:#cce7ec}.question{padding:20px 0;border-bottom:1px solid #e1e9ec}.question strong{display:block;margin-bottom:12px}.choice{display:flex;gap:10px;padding:11px;border:1px solid #dce6e9;border-radius:9px;margin:8px 0;cursor:pointer}.choice:has(input:checked){background:#e4f2f5;border-color:#6da5b4}.choice input{accent-color:#176c81}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar{height:8px;border-radius:8px;background:#e5ecee;overflow:hidden}.bar div{height:100%;background:#438c9d}.finding{border-left:3px solid #4d9aad;background:#f4f9fa;padding:10px;margin:9px 0}.reporttext{white-space:pre-wrap;line-height:1.6}.program-table{border-collapse:collapse;width:100%;font-size:13px}.program-table th,.program-table td{border-bottom:1px solid #dbe5e8;padding:8px;text-align:left}.diagram{width:100%;max-width:700px;height:auto;background:#f7fafb;border:1px solid #dce6e9;border-radius:12px}.warn{background:#fff5e5;padding:9px;border-radius:6px;margin:7px 0}#status{font-size:13px;color:#54717c}@media(max-width:740px){main{display:block}header{padding:20px}}@media print{@page{size:A4;margin:16mm}header,aside,.actions,#status,.interview{display:none!important}main{display:block}.card{border:0}.finding{break-inside:avoid;page-break-inside:avoid}h3{break-after:avoid}.reporttext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11pt;line-height:1.45}#report{display:block!important}}
</style><header><h1>Architecture of Personality</h1><p>Архитектурно интервю · 27 въпроса · Версия 0.4</p></header><main><aside><div class="card"><h3>Проект</h3><div class="field"><label>Име</label><input id="project" type="text" maxlength="120"></div><div class="field"><label>Обитател</label><select id="resident"></select></div><button id="add" class="secondary">+ Добави обитател</button><p class="muted">Отговорите се пазят в този браузър. При анализ се изпращат към сървъра.</p></div><div class="card"><h3>Раздели</h3><div id="nav"></div></div></aside><section><div class="card interview"><h2>Архитектурно задание</h2><p class="muted">Незадължителни данни. Непопълнените полета се отбелязват като неизвестни.</p><div id="brief-fields"></div></div><div class="card interview"><h2 id="title"></h2><div id="count" class="muted"></div><div class="bar"><div id="bar" style="width:0%"></div></div><div id="questions"></div><div class="row actions"><button id="prev" class="secondary">Назад</button><button id="next">Следващ раздел</button><button id="analyze">Генерирай доклад</button></div><p id="status"></p></div><div id="report" class="card" style="display:none"><h2>Архитектурен доклад</h2><div id="reportbody"></div><div class="row actions"><button id="ai">Облачен AI анализ</button><button id="print" class="secondary">Печат / PDF</button><button id="export" class="secondary">Експорт JSON</button></div></div></section></main><script>
const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let qs=[],page=0,active='Обитател 1',report=null,state={project:'Проект 001',residents:{'Обитател 1':{}}};try{let s=JSON.parse(localStorage.getItem('aop031')||localStorage.getItem('aop02'));if(s&&s.residents&&Object.keys(s.residents).length){state=s;active=Object.keys(s.residents)[0]}}catch{};
function save(){state.brief=Object.fromEntries([...document.querySelectorAll('[data-brief]')].map(i=>[i.dataset.brief,i.value]));state.project=el('project').value;localStorage.setItem('aop031',JSON.stringify(state))}function names(){el('resident').innerHTML=Object.keys(state.residents).map(n=>`<option>${esc(n)}</option>`).join('');el('resident').value=active}
function reconcile(){let removed=[];for(const [n,answers] of Object.entries(state.residents)){for(const [id,value] of Object.entries(answers)){const q=qs.find(q=>q.id===id);if(!q||!q.options.includes(value)){delete answers[id];removed.push(n+': '+id)}}}if(removed.length){el('status').textContent='Открити са '+removed.length+' несъвместими стари отговора. Запазихме останалите; моля попълнете липсващите.';}localStorage.setItem('aop031',JSON.stringify(state));}
function draw(){let sections=[...new Set(qs.map(q=>q.section))],part=sections[page],a=state.residents[active];el('title').textContent=part;el('questions').innerHTML=qs.filter(q=>q.section===part).map(q=>`<div class="question"><strong>${esc(q.id)} · ${esc(q.title)}</strong>${q.options.map((o,i)=>`<label class="choice"><input type="radio" name="${q.id}" value="${i}" ${a[q.id]===o?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`).join('');el('questions').querySelectorAll('input').forEach(i=>i.onchange=()=>{let q=qs.find(q=>q.id===i.name);a[q.id]=q.options[Number(i.value)];save();progress()});el('nav').innerHTML=sections.map((s,i)=>`<button class="nav ${i===page?'active':''}" data-i="${i}">${i+1}. ${esc(s)}</button>`).join('');el('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=Number(b.dataset.i);draw()});el('prev').disabled=page===0;el('next').style.display=page===8?'none':'';el('analyze').style.display=page===8?'':'none';progress()}
function progress(){let n=Object.keys(state.residents[active]).length;el('count').textContent=`${active} · ${n} от 27 отговора`;el('bar').style.width=(n/27*100)+'%'}
function show(r){let h=`<p><b>${esc(r.project)}</b> · ${Object.keys(r.residents).length} обитател(и)</p><p class="muted">${esc(r.notice)}</p>`;for(let [name,fs] of Object.entries(r.findings)){h+=`<h3>${esc(name)}</h3><p>Попълнени: ${27-r.missing[name].length}/27</p>`;h+=fs.length?fs.map(f=>`<div class="finding"><b>${esc(f.requirement)}</b><div class="muted">Основание: ${esc(f.evidence.join(', '))} · ${esc(f.status)}</div></div>`).join(''):'<p>Няма автоматично изведени изисквания. Необходим е разговор.</p>';if(r.missing[name].length)h+=`<p class="muted">Непопълнени: ${esc(r.missing[name].join(', '))}</p>`}if(r.comparisons.length){h+='<h3>Различия между обитателите</h3>';h+=r.comparisons.map(c=>`<div class="finding">${esc(c.question)} · ${esc(Object.entries(c.answers).map(([n,v])=>n+': '+v).join('; '))}</div>`).join('')}if(r.brief_missing?.length)h+=`<h3>Неизяснени проектни данни</h3><p>${esc(r.brief_missing.join('; '))}</p>`;if(r.program){const p=r.program;h+=`<h3>Функционална програма v0.4</h3><p class="muted">${esc(p.method)} · Попълнени профили: ${p.completed_profiles}/${p.profile_count}</p><table class="program-table"><thead><tr><th>Зона</th><th>Ориентир m²</th><th>Основание</th></tr></thead><tbody>${p.rooms.map(z=>`<tr><td><b>${esc(z.name)}</b></td><td>${z.area_range_m2.join('–')}</td><td>${esc(z.reason)} <small>${esc(z.evidence.join(', '))}</small></td></tr>`).join('')}</tbody></table><h3>Функционални връзки</h3><div id="diagram-slot"></div><table class="program-table"><tbody>${p.links.map(l=>`<tr><td>${esc(p.rooms.find(z=>z.id===l.from)?.name||l.from)}</td><td>${esc(l.relation)}</td><td>${esc(p.rooms.find(z=>z.id===l.to)?.name||l.to)}</td></tr>`).join('')}</tbody></table>`;if(p.outdoor.length)h+=`<h3>Външни пространства</h3><p>${esc(p.outdoor.map(x=>x.name).join('; '))}</p>`;h+=`<h3>Проверка на площта</h3><p>Целева РЗП: ${p.area_check.target_area_m2??'непосочена'} m². Сума на ориентировъчните зони: ${p.area_check.sum_zone_min_m2}–${p.area_check.sum_zone_max_m2} m² (не е РЗП). Статус: ${esc(p.area_check.status)}.</p><h3>Ограничения и неизвестни</h3>${p.warnings.map(w=>`<p class="warn">${esc(w)}</p>`).join('')}`}if(r.ai_analysis)h+=`<h3>AI анализ</h3><div class="reporttext">${esc(r.ai_analysis)}</div>`;if(r.ai_error)h+=`<p class="muted">${esc(r.ai_error)}</p>`;el('reportbody').innerHTML=h;if(r.program)drawDiagram(r.program);el('report').style.display='block';el('report').scrollIntoView({behavior:'smooth'})}
function drawDiagram(p){const slot=el('diagram-slot');if(!slot)return;const rooms=p.rooms,coords={};const width=680,height=Math.max(240,Math.ceil(rooms.length/3)*110+30);rooms.forEach((r,i)=>{coords[r.id]={x:15+(i%3)*224,y:20+Math.floor(i/3)*110}});let paths=p.links.map(l=>{let a=coords[l.from],b=coords[l.to];if(!a||!b)return '';return `<line x1="${a.x+95}" y1="${a.y+30}" x2="${b.x+95}" y2="${b.y+30}" stroke="#89a4af" stroke-width="2" stroke-dasharray="5 4"/>`}).join('');let nodes=rooms.map(r=>{let c=coords[r.id];return `<rect x="${c.x}" y="${c.y}" width="190" height="60" rx="8" fill="#dcecf0" stroke="#6997a5"/><text x="${c.x+95}" y="${c.y+24}" font-size="12" fill="#203540" text-anchor="middle">${esc(r.name.length>26?r.name.slice(0,25)+'…':r.name)}</text><text x="${c.x+95}" y="${c.y+44}" font-size="11" fill="#49626e" text-anchor="middle">${r.area_range_m2.join('–')} m²</text>`}).join('');slot.innerHTML=`<svg class="diagram" viewBox="0 0 ${width} ${height}" role="img" aria-label="Схема на функционалните зони и връзки">${paths}${nodes}</svg><p class="muted">Схематична диаграма без мащаб, ориентация или реална геометрия.</p>`}
async function analyze(ai){save();el('status').textContent='Обработване...';try{let response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...state,ai})});if(!response.ok){let data=await response.json().catch(()=>({}));let detail=data.detail;throw Error('HTTP '+response.status+': '+(typeof detail==='string'?detail:JSON.stringify(detail||'Невалидна заявка')))}report=await response.json();show(report);el('status').textContent='Готово.'}catch(e){el('status').textContent='Неуспешен анализ: '+e.message}}
const briefFields=[['site_location','Местоположение на имота'],['site_area','Площ на имота (m²)'],['target_area','Желана РЗП (m²)'],['budget','Бюджет (EUR)'],['site_orientation','Ориентация, достъп, гледки'],['site_constraints','Ограничения, регулация, наклон']];el('brief-fields').innerHTML=briefFields.map(([k,l])=>`<div class="field"><label>${l}</label><input type="text" data-brief="${k}" maxlength="240" value="${esc((state.brief||{})[k]||'')}"></div>`).join('');document.querySelectorAll('[data-brief]').forEach(i=>i.oninput=save);el('project').value=state.project;names();el('project').oninput=save;el('resident').onchange=e=>{active=e.target.value;draw()};el('add').onclick=()=>{let n=prompt('Име на нов обитател:',`Обитател ${Object.keys(state.residents).length+1}`);if(!n||state.residents[n])return;state.residents[n]={};active=n;save();names();draw()};el('prev').onclick=()=>{page--;draw()};el('next').onclick=()=>{page++;draw()};el('analyze').onclick=()=>analyze(false);el('ai').onclick=()=>analyze(true);el('print').onclick=()=>window.print();el('export').onclick=()=>{let b=new Blob([JSON.stringify({data:state,report},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='architecture-of-personality.json';a.click();URL.revokeObjectURL(u)};
fetch('/api/questions').then(r=>r.json()).then(q=>{qs=q;reconcile();draw()}).catch(()=>el('status').textContent='Сървърът не е достъпен.');
</script></html>

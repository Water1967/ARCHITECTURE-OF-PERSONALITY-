<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Architecture of Personality</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#203540;font:16px system-ui,Arial}header{background:#183845;color:white;padding:24px max(20px,calc((100vw - 1050px)/2))}h1{margin:0;font-size:27px}header p{margin:5px 0;color:#bdd0d6}main{max-width:1050px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:245px 1fr;gap:18px}.card{background:white;border:1px solid #dbe5e8;border-radius:13px;padding:20px;margin-bottom:16px}h2{margin:0 0 15px;font-size:21px}h3{font-size:16px;margin:0 0 12px}.muted{color:#667984;font-size:13px}button{border:0;background:#176c81;color:white;border-radius:8px;padding:10px 14px;cursor:pointer;font:inherit}button.secondary{background:#e6eff1;color:#244452}button:disabled{opacity:.4}input[type=text],select{width:100%;padding:10px;border:1px solid #cad7dc;border-radius:8px;font:inherit}.field{margin:12px 0}.field label{display:block;margin-bottom:5px;font-size:13px}.nav{display:block;width:100%;text-align:left;background:#f1f6f7;color:#244653;margin:5px 0}.nav.active{background:#cce7ec}.question{padding:20px 0;border-bottom:1px solid #e1e9ec}.question strong{display:block;margin-bottom:12px}.choice{display:flex;gap:10px;padding:11px;border:1px solid #dce6e9;border-radius:9px;margin:8px 0;cursor:pointer}.choice:has(input:checked){background:#e4f2f5;border-color:#6da5b4}.choice input{accent-color:#176c81}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar{height:8px;border-radius:8px;background:#e5ecee;overflow:hidden}.bar div{height:100%;background:#438c9d}.finding{border-left:3px solid #4d9aad;background:#f4f9fa;padding:10px;margin:9px 0}.reporttext{white-space:pre-wrap;line-height:1.6}#status{font-size:13px;color:#54717c}@media(max-width:740px){main{display:block}header{padding:20px}}@media print{header,aside,.actions,#status,.interview{display:none!important}main{display:block}.card{border:0}#report{display:block!important}}
</style><header><h1>Architecture of Personality</h1><p>Архитектурно интервю · 27 въпроса · Версия 0.3</p></header><main><aside><div class="card"><h3>Проект</h3><div class="field"><label>Име</label><input id="project" type="text" maxlength="120"></div><div class="field"><label>Обитател</label><select id="resident"></select></div><button id="add" class="secondary">+ Добави обитател</button><p class="muted">Отговорите се пазят в този браузър. При анализ се изпращат към сървъра.</p></div><div class="card"><h3>Раздели</h3><div id="nav"></div></div></aside><section><div class="card interview"><h2>Архитектурно задание</h2><p class="muted">Незадължителни данни. Непопълнените полета се отбелязват като неизвестни.</p><div id="brief-fields"></div></div><div class="card interview"><h2 id="title"></h2><div id="count" class="muted"></div><div class="bar"><div id="bar" style="width:0%"></div></div><div id="questions"></div><div class="row actions"><button id="prev" class="secondary">Назад</button><button id="next">Следващ раздел</button><button id="analyze">Генерирай доклад</button></div><p id="status"></p></div><div id="report" class="card" style="display:none"><h2>Архитектурен доклад</h2><div id="reportbody"></div><div class="row actions"><button id="ai">Облачен AI анализ</button><button id="print" class="secondary">Печат / PDF</button><button id="export" class="secondary">Експорт JSON</button></div></div></section></main><script>
const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let qs=[],page=0,active='Обитател 1',report=null,state={project:'Проект 001',residents:{'Обитател 1':{}}};try{let s=JSON.parse(localStorage.getItem('aop02'));if(s&&s.residents&&Object.keys(s.residents).length){state=s;active=Object.keys(s.residents)[0]}}catch{};
function save(){state.brief=Object.fromEntries([...document.querySelectorAll('[data-brief]')].map(i=>[i.dataset.brief,i.value]));state.project=el('project').value;localStorage.setItem('aop02',JSON.stringify(state))}function names(){el('resident').innerHTML=Object.keys(state.residents).map(n=>`<option>${esc(n)}</option>`).join('');el('resident').value=active}
function draw(){let sections=[...new Set(qs.map(q=>q.section))],part=sections[page],a=state.residents[active];el('title').textContent=part;el('questions').innerHTML=qs.filter(q=>q.section===part).map(q=>`<div class="question"><strong>${esc(q.id)} · ${esc(q.title)}</strong>${q.options.map((o,i)=>`<label class="choice"><input type="radio" name="${q.id}" value="${i}" ${a[q.id]===o?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`).join('');el('questions').querySelectorAll('input').forEach(i=>i.onchange=()=>{let q=qs.find(q=>q.id===i.name);a[q.id]=q.options[Number(i.value)];save();progress()});el('nav').innerHTML=sections.map((s,i)=>`<button class="nav ${i===page?'active':''}" data-i="${i}">${i+1}. ${esc(s)}</button>`).join('');el('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=Number(b.dataset.i);draw()});el('prev').disabled=page===0;el('next').style.display=page===8?'none':'';el('analyze').style.display=page===8?'':'none';progress()}
function progress(){let n=Object.keys(state.residents[active]).length;el('count').textContent=`${active} · ${n} от 27 отговора`;el('bar').style.width=(n/27*100)+'%'}
function show(r){let h=`<p><b>${esc(r.project)}</b> · ${Object.keys(r.residents).length} обитател(и)</p><p class="muted">${esc(r.notice)}</p>`;for(let [name,fs] of Object.entries(r.findings)){h+=`<h3>${esc(name)}</h3><p>Попълнени: ${27-r.missing[name].length}/27</p>`;h+=fs.length?fs.map(f=>`<div class="finding"><b>${esc(f.requirement)}</b><div class="muted">Основание: ${esc(f.evidence.join(', '))} · ${esc(f.status)}</div></div>`).join(''):'<p>Няма автоматично изведени изисквания. Необходим е разговор.</p>';if(r.missing[name].length)h+=`<p class="muted">Непопълнени: ${esc(r.missing[name].join(', '))}</p>`}if(r.comparisons.length){h+='<h3>Различия между обитателите</h3>';h+=r.comparisons.map(c=>`<div class="finding">${esc(c.question)} · ${esc(Object.entries(c.answers).map(([n,v])=>n+': '+v).join('; '))}</div>`).join('')}if(r.brief_missing?.length)h+=`<h3>Неизяснени проектни данни</h3><p>${esc(r.brief_missing.join('; '))}</p>`;if(r.ai_analysis)h+=`<h3>AI анализ</h3><div class="reporttext">${esc(r.ai_analysis)}</div>`;if(r.ai_error)h+=`<p class="muted">${esc(r.ai_error)}</p>`;el('reportbody').innerHTML=h;el('report').style.display='block';el('report').scrollIntoView({behavior:'smooth'})}
async function analyze(ai){save();el('status').textContent='Обработване...';try{let response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...state,ai})});if(!response.ok)throw Error('Неуспешна заявка');report=await response.json();show(report);el('status').textContent='Готово.'}catch(e){el('status').textContent='Неуспешен анализ. Проверете връзката.'}}
const briefFields=[['site_location','Местоположение на имота'],['site_area','Площ на имота (m²)'],['target_area','Желана РЗП (m²)'],['budget','Бюджет (EUR)'],['site_orientation','Ориентация, достъп, гледки'],['site_constraints','Ограничения, регулация, наклон']];el('brief-fields').innerHTML=briefFields.map(([k,l])=>`<div class="field"><label>${l}</label><input type="text" data-brief="${k}" maxlength="240" value="${esc((state.brief||{})[k]||'')}"></div>`).join('');document.querySelectorAll('[data-brief]').forEach(i=>i.oninput=save);el('project').value=state.project;names();el('project').oninput=save;el('resident').onchange=e=>{active=e.target.value;draw()};el('add').onclick=()=>{let n=prompt('Име на нов обитател:',`Обитател ${Object.keys(state.residents).length+1}`);if(!n||state.residents[n])return;state.residents[n]={};active=n;save();names();draw()};el('prev').onclick=()=>{page--;draw()};el('next').onclick=()=>{page++;draw()};el('analyze').onclick=()=>analyze(false);el('ai').onclick=()=>analyze(true);el('print').onclick=()=>window.print();el('export').onclick=()=>{let b=new Blob([JSON.stringify({data:state,report},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='architecture-of-personality.json';a.click();URL.revokeObjectURL(u)};
fetch('/api/questions').then(r=>r.json()).then(q=>{qs=q;draw()}).catch(()=>el('status').textContent='Сървърът не е достъпен.');
</script></html>
